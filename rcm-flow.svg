<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ tổng thể luồng recommendation</title>
  <desc id="desc">Sơ đồ thể hiện frontend gọi recommendation, backend xử lý feed, Redis, MySQL, AI service, tracking, RabbitMQ và refresh artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .lane-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box { stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .frontend { fill: #e0f2fe; stroke: #0284c7; }
      .backend { fill: #ede9fe; stroke: #7c3aed; }
      .data { fill: #dcfce7; stroke: #16a34a; }
      .ai { fill: #fef3c7; stroke: #d97706; }
      .track { fill: #ffe4e6; stroke: #e11d48; }
      .refresh { fill: #f1f5f9; stroke: #475569; }
      .label { font: 700 19px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 13px Arial, sans-serif; fill: #475569; }
      .num { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .circle { fill: #0f172a; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .note-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .note-text { font: 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1180"/>

  <text x="60" y="58" style="font: 800 34px Arial, sans-serif; fill:#0f172a;">Sơ đồ tổng thể luồng Recommendation</text>
  <text x="60" y="88" style="font: 16px Arial, sans-serif; fill:#475569;">Đọc theo mũi tên từ trái sang phải, sau đó theo vòng tracking ở phía dưới.</text>

  <rect class="lane" x="50" y="120" width="330" height="820"/>
  <text class="lane-title" x="82" y="160">Frontend</text>
  <text class="tiny" x="82" y="184">client-next</text>

  <rect class="lane" x="420" y="120" width="470" height="820"/>
  <text class="lane-title" x="452" y="160">Backend</text>
  <text class="tiny" x="452" y="184">server recommendation module</text>

  <rect class="lane" x="930" y="120" width="300" height="820"/>
  <text class="lane-title" x="962" y="160">Dữ liệu</text>
  <text class="tiny" x="962" y="184">Redis + MySQL</text>

  <rect class="lane" x="1270" y="120" width="280" height="820"/>
  <text class="lane-title" x="1302" y="160">AI Service</text>
  <text class="tiny" x="1302" y="184">FastAPI + pgvector</text>

  <!-- Frontend boxes -->
  <rect class="box frontend" x="85" y="220" width="250" height="86"/>
  <circle class="circle" cx="110" cy="245" r="15"/><text class="num" x="106" y="250">1</text>
  <text class="label" x="132" y="250">User mở trang</text>
  <text class="small" x="132" y="276">Home / Product / Cart / Orders</text>

  <rect class="box frontend" x="85" y="350" width="250" height="92"/>
  <circle class="circle" cx="110" cy="375" r="15"/><text class="num" x="106" y="380">2</text>
  <text class="label" x="132" y="380">RecommendationShelf</text>
  <text class="small" x="132" y="406">Chọn kind: home, product,</text>
  <text class="small" x="132" y="426">cart hoặc personalized</text>

  <rect class="box frontend" x="85" y="486" width="250" height="92"/>
  <circle class="circle" cx="110" cy="511" r="15"/><text class="num" x="106" y="516">3</text>
  <text class="label" x="132" y="516">Gọi API feed</text>
  <text class="small" x="132" y="542">recommendationService</text>
  <text class="small" x="132" y="562">kèm sessionId + limit</text>

  <rect class="box frontend" x="85" y="752" width="250" height="92"/>
  <circle class="circle" cx="110" cy="777" r="15"/><text class="num" x="106" y="782">9</text>
  <text class="label" x="132" y="782">Render ProductCard</text>
  <text class="small" x="132" y="808">Hiển thị sản phẩm gợi ý</text>
  <text class="small" x="132" y="828">cho người dùng</text>

  <!-- Backend boxes -->
  <rect class="box backend" x="470" y="220" width="360" height="86"/>
  <circle class="circle" cx="496" cy="245" r="15"/><text class="num" x="492" y="250">4</text>
  <text class="label" x="520" y="250">RecommendationAPI</text>
  <text class="small" x="520" y="276">Validate sessionId, limit, auth</text>

  <rect class="box backend" x="470" y="350" width="360" height="92"/>
  <circle class="circle" cx="496" cy="375" r="15"/><text class="num" x="492" y="380">5</text>
  <text class="label" x="520" y="380">Controller + UseCase</text>
  <text class="small" x="520" y="406">Định tuyến theo kind</text>
  <text class="small" x="520" y="426">home / product / cart / personalized</text>

  <rect class="box backend" x="470" y="486" width="360" height="122"/>
  <circle class="circle" cx="496" cy="511" r="15"/><text class="num" x="492" y="516">6</text>
  <text class="label" x="520" y="516">Repository tạo danh sách</text>
  <text class="small" x="520" y="542">Đọc cache, lấy tín hiệu, gọi AI,</text>
  <text class="small" x="520" y="562">fallback, merge score, dedupe</text>
  <text class="tiny" x="520" y="588">Kết quả: productId + score + reason + source</text>

  <rect class="box backend" x="470" y="752" width="360" height="92"/>
  <circle class="circle" cx="496" cy="777" r="15"/><text class="num" x="492" y="782">8</text>
  <text class="label" x="520" y="782">getProductCards</text>
  <text class="small" x="520" y="808">Lấy tên, ảnh, giá thấp nhất,</text>
  <text class="small" x="520" y="828">trạng thái sale</text>

  <!-- Data boxes -->
  <rect class="box data" x="975" y="220" width="210" height="88"/>
  <text class="label" x="1002" y="256">Redis cache</text>
  <text class="small" x="1002" y="282">Feed cache theo key</text>

  <rect class="box data" x="975" y="350" width="210" height="92"/>
  <text class="label" x="1002" y="386">MySQL</text>
  <text class="small" x="1002" y="412">products, cart, events,</text>
  <text class="small" x="1002" y="432">product_similarities</text>

  <rect class="box data" x="975" y="752" width="210" height="92"/>
  <text class="label" x="1002" y="788">Product data</text>
  <text class="small" x="1002" y="814">images, variants, price,</text>
  <text class="small" x="1002" y="834">category, sale</text>

  <!-- AI boxes -->
  <rect class="box ai" x="1305" y="486" width="210" height="104"/>
  <text class="label" x="1332" y="522">/recommend/hybrid</text>
  <text class="small" x="1332" y="548">Vector similarity</text>
  <text class="small" x="1332" y="568">+ popularity score</text>

  <rect class="box ai" x="1305" y="636" width="210" height="92"/>
  <text class="label" x="1332" y="672">pgvector</text>
  <text class="small" x="1332" y="698">product_embeddings</text>
  <text class="small" x="1332" y="718">cosine search</text>

  <!-- Tracking lane -->
  <rect class="note" x="50" y="980" width="1500" height="150"/>
  <text class="note-title" x="82" y="1014">Vòng phản hồi hành vi sau khi hiển thị</text>

  <rect class="box track" x="85" y="1040" width="230" height="64"/>
  <text class="label" x="112" y="1066">Impression / Click</text>
  <text class="small" x="112" y="1090">RecommendationShelf track</text>

  <rect class="box track" x="365" y="1040" width="210" height="64"/>
  <text class="label" x="392" y="1066">POST /api/track</text>
  <text class="small" x="392" y="1090">kèm x-session-id</text>

  <rect class="box track" x="625" y="1040" width="230" height="64"/>
  <text class="label" x="652" y="1066">Lưu event</text>
  <text class="small" x="652" y="1090">recommendation_events</text>

  <rect class="box track" x="905" y="1040" width="230" height="64"/>
  <text class="label" x="932" y="1066">Xóa cache cũ</text>
  <text class="small" x="932" y="1090">home/cart/personalized</text>

  <rect class="box track" x="1185" y="1040" width="300" height="64"/>
  <text class="label" x="1212" y="1066">RabbitMQ consumer</text>
  <text class="small" x="1212" y="1090">dedupeKey tránh ghi trùng</text>

  <!-- Feed logic notes -->
  <rect class="note" x="935" y="480" width="290" height="220"/>
  <text class="note-title" x="960" y="514">Nguồn tín hiệu theo feed</text>
  <text class="note-text" x="960" y="544">Home: search + session anonymous</text>
  <text class="note-text" x="960" y="572">Product: pgvector + co-occurrence</text>
  <text class="note-text" x="960" y="600">Cart: sản phẩm trong giỏ + category</text>
  <text class="note-text" x="960" y="628">Personalized: recent events + search</text>
  <text class="note-text" x="960" y="656">Tất cả đều merge score và dedupe</text>

  <!-- Refresh note -->
  <rect class="box refresh" x="1275" y="220" width="250" height="132"/>
  <text class="label" x="1302" y="256">Refresh artifacts</text>
  <text class="small" x="1302" y="282">Mặc định mỗi 15 phút</text>
  <text class="small" x="1302" y="308">/train + /embed/products</text>
  <text class="small" x="1302" y="334">cập nhật pgvector</text>

  <!-- Main arrows -->
  <path class="arrow" d="M335 263 L470 263"/>
  <path class="arrow" d="M210 306 L210 350"/>
  <path class="arrow" d="M210 442 L210 486"/>
  <path class="arrow" d="M335 532 L470 532"/>
  <path class="arrow" d="M650 306 L650 350"/>
  <path class="arrow" d="M650 442 L650 486"/>
  <path class="arrow" d="M830 532 L975 264"/>
  <path class="arrow" d="M830 552 L975 396"/>
  <path class="arrow" d="M830 532 L1305 532"/>
  <path class="arrow" d="M1410 590 L1410 636"/>
  <path class="arrow" d="M1305 682 L1185 682"/>
  <path class="arrow" d="M1305 548 L830 586"/>
  <path class="arrow" d="M650 608 L650 752"/>
  <path class="arrow" d="M830 798 L975 798"/>
  <path class="arrow" d="M470 798 L335 798"/>
  <path class="arrow" d="M210 578 L210 752"/>

  <!-- Tracking arrows -->
  <path class="arrow" d="M315 1072 L365 1072"/>
  <path class="arrow" d="M575 1072 L625 1072"/>
  <path class="arrow" d="M855 1072 L905 1072"/>
  <path class="arrow" d="M1135 1072 L1185 1072"/>
  <path class="dash" d="M1020 1040 C960 940, 820 920, 700 880 C610 848, 560 838, 470 820"/>
  <path class="dash" d="M1335 1040 C1260 940, 1160 880, 1080 844"/>

  <!-- Refresh arrows -->
  <path class="dash" d="M1400 352 L1400 486"/>
  <path class="dash" d="M1275 286 L1185 396"/>
  <path class="dash" d="M1400 352 L1410 636"/>
</svg>
